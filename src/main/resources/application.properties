spring.application.name=sgu

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dbsgu}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Security Configuration
api.security.token.secret=${JWT_SECRET:your-secret-key-here}
api.security.token.expiration=${JWT_EXPIRATION:86400000}

# Logging Configuration
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=${LOG_SQL:WARN}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOG_SQL:WARN}
logging.level.web=${LOG_LEVEL:INFO}

# Application Configuration
spring.main.allow-bean-definition-overriding=false
csv.diretorio.id=${CSV_DIRECTORY_ID:5914e2d5-889c-471d-a3a5-6d7c3687e5c4}

# CORS Configuration
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:8080}
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true

# Cache Configuration
spring.cache.type=simple
spring.cache.cache-names=users,departments
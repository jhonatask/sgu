# Configuração para ambiente de PRODUÇÃO
# Este arquivo é carregado quando SPRING_PROFILES_ACTIVE=prod

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dbsgu}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# JPA Configuration para produção
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Security Configuration
api.security.token.secret=${JWT_SECRET:your-secret-key-here}
api.security.token.expiration=${JWT_EXPIRATION:86400000}

# Logging Configuration para produção
logging.level.br.com.jproject.sgu=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.web=INFO
logging.file.name=logs/sgu-application.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# CORS Configuration
app.cors.allowed-origins=${CORS_ORIGINS:https://yourdomain.com}
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true

# Cache Configuration
spring.cache.type=simple
spring.cache.cache-names=users,departments,user-by-email,user-by-cpf

# CSV Configuration
csv.diretorio.id=${CSV_DIRECTORY_ID:5914e2d5-889c-471d-a3a5-6d7c3687e5c4}

# Actuator para produção (limitado)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.security.enabled=true

# Server Configuration
server.port=8080
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Configuração para ambiente de DESENVOLVIMENTO
# Este arquivo é carregado quando SPRING_PROFILES_ACTIVE=dev

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dbsgu}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}

# JPA Configuration para desenvolvimento
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Security Configuration
api.security.token.secret=${JWT_SECRET:dev-secret-key-change-in-production}
api.security.token.expiration=${JWT_EXPIRATION:86400000}

# Logging Configuration para desenvolvimento
logging.level.br.com.jproject.sgu=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.web=DEBUG

# CORS Configuration
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:8080}
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true

# Cache Configuration
spring.cache.type=simple
spring.cache.cache-names=users,departments,user-by-email,user-by-cpf

# CSV Configuration
csv.diretorio.id=${CSV_DIRECTORY_ID:5914e2d5-889c-471d-a3a5-6d7c3687e5c4}

# Actuator para desenvolvimento
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
